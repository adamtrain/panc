[project]
name = "panc"
version = "0.1.0"
description = "Pangram AI-detection from your terminal: clipboard, pipe, or argument."
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
authors = [
    { name = "Adam Train", email = "adam@adametrain.com" }
]
requires-python = ">=3.13"
keywords = ["ai-detection", "pangram", "cli", "clipboard", "llm"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
panc = "panc.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
